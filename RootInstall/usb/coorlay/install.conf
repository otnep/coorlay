# coorlay root installer settings. 1 = do it, 0 = skip. Read by install.sh; Windows line endings are fine.

# Install or update coorlay from the only *.apk in this folder (settings and pairing are kept).
INSTALL_APP=1

# Fix Wi-Fi Direct: link /data/misc/wifi/sockets/p2p0 -> /data/system/wpa_supplicant/p2p0.
# Also undoes the v3 change of p2p_supplicant.conf, which broke the head-unit Wi-Fi client.
FIX_WIFI_DIRECT=1

# Undo FIX_WIFI_DIRECT (remove the link, put back v3's file) and ENABLE_WIFI_DIRECT_FEATURE (remove only the
# feature file coorlay added). Set FIX_WIFI_DIRECT=0 together with it.
RESTORE_WIFI_DIRECT=0

# For firmware without Wi-Fi Direct (05.07.06000.H50): add /system/etc/permissions/android.hardware.wifi.direct.xml.
# Writes to /system. Only when the firmware has a p2p_supplicant service on p2p0 and the known Wi-Fi settings.
# Takes effect after the ignition is turned off and on. If the head-unit Wi-Fi stops working, undo with RESTORE_WIFI_DIRECT=1.
ENABLE_WIFI_DIRECT_FEATURE=0

# Copy the stock popview/Bluetooth phone apps and /system/framework to coorlay/dump on this stick (about 90 MB).
# Read only: nothing on the head unit changes.
DUMP_SYSTEM_APPS=0

# After a run the entry folder is renamed to _b832bc61... so the script does not run again on every start.
RUN_ONCE=1
