# coorlay root installer settings. 1 = do it, 0 = skip. Read by install.sh; Windows line endings are fine.

# Install or update coorlay from the only *.apk in this folder (settings and pairing are kept).
INSTALL_APP=1

# Fix Wi-Fi Direct: link /data/misc/wifi/sockets/p2p0 -> /data/system/wpa_supplicant/p2p0.
# Also undoes the v3 change of p2p_supplicant.conf, which broke the head-unit Wi-Fi client.
FIX_WIFI_DIRECT=1

# Undo FIX_WIFI_DIRECT (remove the link, put back v3's file). Set FIX_WIFI_DIRECT=0 together with it.
RESTORE_WIFI_DIRECT=0

# After a run the entry folder is renamed to _b832bc61... so the script does not run again on every start.
RUN_ONCE=1
